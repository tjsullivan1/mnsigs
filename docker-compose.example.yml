# Docker Compose for MN Sigs PayPal Storefront
# Complete frontend + backend deployment

version: "3.8"

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Backend API URL - points to backend service
        VITE_API_BASE_URL: http://localhost:8000
        # PayPal Client ID - replace with your sandbox/production client ID
        VITE_PAYPAL_CLIENT_ID: REPLACE_WITH_YOUR_PAYPAL_CLIENT_ID
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # PayPal Configuration
      - PAYPAL_CLIENT_ID=REPLACE_WITH_YOUR_PAYPAL_CLIENT_ID
      - PAYPAL_CLIENT_SECRET=REPLACE_WITH_YOUR_PAYPAL_CLIENT_SECRET
      - PAYPAL_MODE=sandbox  # or 'live' for production
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
    networks:
      - app-network
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes
volumes:
  postgres_data:

# Networks
networks:
  app-network:
    driver: bridge

# Usage Instructions:
# 1. Replace REPLACE_WITH_YOUR_PAYPAL_CLIENT_ID with your actual PayPal client ID
# 2. Update my-backend-image:latest with your backend Docker image
# 3. Adjust environment variables as needed for your setup
# 4. Run: docker-compose up -d
#
# Development Usage:
# - Use PayPal sandbox client ID for testing
# - Set backend to development mode
# - Consider using volume mounts for live code reloading
#
# Production Usage:
# - Use production PayPal client ID
# - Ensure all secrets are properly managed (consider Docker secrets)
# - Add proper logging and monitoring
# - Use production-grade database configuration
# - Add SSL/TLS termination (nginx proxy, load balancer, etc.)
#
# Security Notes:
# - Never commit real PayPal credentials to version control
# - Use environment files (.env) for sensitive data
# - Consider using Docker secrets for production deployments
# - Implement proper CORS policies in your backend